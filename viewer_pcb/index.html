<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor 3D de KiCad</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        /* Contenedor del visor 3D */
        model-viewer {
            width: 80%;
            height: 70vh;
            background-color: #2a2a2a;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .controls {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #aaa;
        }
    </style>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>
<body>

    <h1>Visor Interactivo 3D - Mi Placa KiCad</h1>

    <model-viewer 
        src="DISPLAY_COLOR.glb" 
        alt="Modelo 3D de mi PCB exportada de KiCad" 
        auto-rotate 
        camera-controls 
        shadow-intensity="1" 
        exposure="1.2"
        environment-image="neutral">
    </model-viewer>

    <div class="controls">
        <p>Usa el mouse para rotar, scroll para hacer zoom y arrastra con clic derecho para mover.</p>
    </div>

</body>
</html>
